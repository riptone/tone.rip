name: Release doti

# apps/doti is a binary people install on their own machines, so like
# apps/ssh-cv it is released rather than deployed - `main` has nowhere to push
# it. This workflow turns a tag into a release, and
# apps/doti/scripts/install.sh is what pulls from it.
#
# Tags are namespaced (`doti/v1.0.0`) for the reason ssh-cv's are: in a
# monorepo, "the newest doti release" has to be a different question from "the
# newest release". The prefix is what the installer filters on, so it is not
# decoration.
on:
  push:
    tags: ["doti/v*"]

permissions:
  contents: write

concurrency:
  group: release-doti-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Both, because apps/doti requires packages/gotui through a replace
          # directive and the shared module has its own dependency graph.
          cache-dependency-path: |
            apps/doti/go.sum
            packages/gotui/go.sum

      # "doti/v1.0.0" -> "v1.0.0". The binary carries the second form: the
      # prefix answers "which app", which a binary that only ever is one app
      # does not need.
      - name: Read the version out of the tag
        run: echo "VERSION=${GITHUB_REF_NAME#doti/}" >> "$GITHUB_ENV"

      # A tag can point at any commit, including one that never passed CI.
      # These are the checks that would catch a broken release, so they run
      # here rather than being assumed from main.
      - name: Test the shared window chrome
        working-directory: packages/gotui
        run: go test ./...

      - name: Test
        working-directory: apps/doti
        run: go test ./...

      # Six binaries, because a dotfiles installer that only covers the
      # machine its author happens to own is the problem it exists to solve.
      #
      # CGO_ENABLED=0 is explicit rather than implied: doti shells out to git,
      # brew, winget and bw and links nothing, so a static binary runs on any
      # libc - which matters for the Linux boxes it will be curl-installed on.
      - name: Build
        working-directory: apps/doti
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "${os}" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/doti_${os}_${arch}${ext}" ./cmd/doti
          done
          cd dist && sha256sum doti_* > SHA256SUMS
          cat SHA256SUMS

      # The installer asks the downloaded binary its own version before it
      # goes near PATH. If the stamp did not land, every install would report
      # "dev" and the updater could never tell old from new.
      - name: Check the version stamp landed
        working-directory: apps/doti/dist
        run: |
          got=$(./doti_linux_amd64 version)
          if [ "${got}" != "${VERSION}" ]; then
            echo "::error::binary reports '${got}', tag says '${VERSION}'"
            exit 1
          fi
          echo "stamped ${got}"

      - name: Publish
        working-directory: apps/doti/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            doti_darwin_amd64 doti_darwin_arm64 \
            doti_linux_amd64 doti_linux_arm64 \
            doti_windows_amd64.exe doti_windows_arm64.exe \
            SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "doti ${VERSION}" \
            --generate-notes
