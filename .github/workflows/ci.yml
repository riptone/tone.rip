name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Applies to every job below, none of which has its own `permissions` key.
#
# Every job does exactly one privileged thing - clone this repository - so read
# access to its contents is the whole requirement. Deploying does not need
# more: it authenticates to Cloudflare with CLOUDFLARE_API_TOKEN, which has
# nothing to do with the GITHUB_TOKEN this scopes.
#
# Written down rather than left to the default, because the default is not a
# fixed thing: it is whatever the repository or organisation is set to, it was
# read-write for anything created before February 2023, and someone who has
# never seen this file can change it. Stating it means the workflow keeps the
# permissions it actually needs if it is forked, copied into another
# organisation, or the account default moves under it.
permissions:
  contents: read

# This used to be one job running thirteen steps in a line, which meant the
# Go toolchain was installed so that two steps at the bottom could use it,
# and a two-minute Playwright run sat behind a type-check it did not depend
# on. It is now three jobs split by what each one actually needs installed:
#
#   checks  bun only          the TypeScript half - lint, types, unit tests
#   e2e     bun + a browser   the built Workers, their size, and Playwright
#   go      bun + Go          apps/ssh-cv, its installer, its dependencies
#
# They run at once and the slowest one sets the wall clock. `deploy` waits
# for all three.
#
# Every job restores turbo's cache, so a job only re-runs the tasks whose
# inputs changed - and `e2e` hands its build output to `deploy` as an
# artifact rather than having it built a second time from scratch.
jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # turbo hashes each task's declared inputs and skips the ones that have
      # not moved. Without a restored cache every run started cold, which for
      # a repo this size is most of the runtime. Keyed by commit so each run
      # writes its own entry, with a prefix fallback so a new commit starts
      # from the previous one rather than from nothing.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-checks-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-checks-${{ runner.os }}-

      # apps/ssh-cv's check-types and test are Go, and live in the `go` job
      # below with the rest of the Go toolchain. Everything else is here.
      - name: Lint, type-check, unit tests, knip, cycles
        run: >
          bunx turbo run //#lint //#knip //#check-cycles
          check-types test --filter='!@repo/ssh-cv'

  e2e:
    name: Build, bundle size, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-

      # Browsers install to a global, user-level directory rather than
      # per-project, so one install covers both apps/web's and
      # apps/dashboard's suites - and caching that directory means it is a
      # download on the first run after a version bump and a restore on every
      # run after. Keyed on the lockfile because that is what pins the
      # Playwright version; `install --with-deps` still runs to put the system
      # libraries in place, which are outside the cached directory.
      - name: Cache Playwright's browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright's browser
        working-directory: apps/web
        run: bun run playwright install --with-deps chromium

      # apps/ssh-cv is filtered out for the same reason as above: its build
      # is `go build`, and this job has no Go. The `go` job builds it.
      - name: Build the Workers and check their bundle sizes
        run: >
          bunx turbo run build //#check-bundle-size
          --filter='!@repo/ssh-cv'

      # Each app's e2e:server script builds and boots its own `wrangler dev`
      # - see docs/engineering.md's "Per-request nonces and soft navigation"
      # note for why this has to be the real Worker, not `astro dev`.
      - name: E2E (Playwright)
        run: bunx turbo run e2e

      # Pilot alongside Playwright — mirrors its coverage via Bun.WebView.
      # On Linux WebView uses the chrome backend; it auto-discovers the browser
      # in this order: $BUN_CHROME_PATH → $PATH (google-chrome-stable etc) →
      # Playwright's cache (chrome-headless-shell). The chromium install above
      # provides both the binary and the system deps, and ubuntu-latest also
      # ships google-chrome-stable in $PATH — no extra install needed.
      # keep continue-on-error until cutover from Playwright.
      - name: E2E (WebView pilot — chrome backend)
        working-directory: apps/web
        continue-on-error: true
        run: bun run e2e:webview:ci

      # Handed to `deploy` so it does not build the same tree again. It is
      # also the stronger guarantee: what ships is the artifact these tests
      # ran against, not a rebuild that happens to come from the same commit.
      # apps/api is absent on purpose - its Worker entry is `src/index.ts`,
      # so `wrangler deploy` bundles it from source and there is no dist.
      #
      # `.wrangler/deploy/config.json` ships with dist because it is the file
      # that points wrangler at the build. The adapter writes the real Worker
      # config to `dist/server/wrangler.json` - `main: entry.mjs`, assets at
      # `../client` - and leaves that one-line redirect behind for wrangler to
      # follow. Without it wrangler reads the checked-in `wrangler.jsonc`
      # instead, whose `main` is `./src/worker.ts`, and the deploy dies trying
      # to bundle Astro source: `Could not resolve "virtual:astro:app"`.
      #
      # `include-hidden-files` because both it and `dist/client/.assetsignore`
      # sit under a dot-path, and upload-artifact has silently dropped those
      # since v4.4 - which is how the redirect went missing here to begin with.
      - name: Upload the built sites
        uses: actions/upload-artifact@v7
        with:
          name: worker-dist
          include-hidden-files: true
          path: |
            apps/web/dist
            apps/web/.wrangler/deploy/config.json
            apps/dashboard/dist
            apps/dashboard/.wrangler/deploy/config.json
          retention-days: 1
          if-no-files-found: error

  go:
    name: Go build, vet, installer, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/ssh-cv/go.sum

      # apps/ssh-cv's build regenerates its embedded CV from packages/content,
      # so the workspace has to be installed even though the binary is Go.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-go-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-go-${{ runner.os }}-

      # gofmt + go vet, go test, go build - the three tasks apps/ssh-cv
      # declares, which are the reason this job installs Go at all.
      - name: Build, vet and test apps/ssh-cv
        run: bunx turbo run check-types test build --filter=@repo/ssh-cv

      # apps/ssh-cv embeds a CV generated from packages/content. The build
      # above regenerates it, so a diff here means the committed copy drifted
      # from the source module and the SSH CV would serve stale text.
      - name: Check the generated CV is up to date
        run: git diff --exit-code -- apps/ssh-cv/internal/cv/cv.json

      # apps/ssh-cv/scripts/install.sh runs as root on the box that serves the
      # CV, and updates it unattended on a timer - so it is the one file here
      # whose bugs arrive by themselves. Biome does not read shell, and
      # shellcheck is already on the runner image, so this costs nothing.
      #
      # --enable=all rather than the default set, because the two checks that
      # actually caught things here (quoting, and [ vs [[ in bash) are both
      # optional ones. The two exclusions are by design, not unfixed:
      #
      #   SC2310  a function in an `if`/`||` condition disables `set -e` inside
      #           it. True, and wanted: `die` exits by itself, and
      #           `service_exists` is a predicate - putting predicates in `if`
      #           is the point of writing one.
      #   SC2312  a command substitution inside a string masks its exit status.
      #           Also true, also wanted: a failed `uname -n` should leave a
      #           notification title short, not abort an update that worked.
      - name: Lint the installer (shellcheck)
        run: shellcheck --enable=all --exclude=SC2310,SC2312 apps/ssh-cv/scripts/install.sh

      # Go dependency vulnerabilities, filtered by whether this code can
      # actually reach them. That reachability analysis is the reason to run it
      # instead of a generic scanner: `golang.org/x/crypto/openpgp` is flagged
      # as unsafe by design and is in our module graph, but nothing here calls
      # it - a scanner without call-graph analysis fails the build on that and
      # teaches everyone to ignore the build.
      #
      # Not a complete answer on its own: it reads the Go vulnerability
      # database, which does not carry every GitHub advisory (the wish SCP
      # traversal in security_test.go is absent from it). Dependabot's `gomod`
      # entry covers that side.
      #
      # Pinned rather than @latest - this runs arbitrary code in CI, so it
      # should change when we say it changes.
      - name: Check Go dependencies for known vulnerabilities
        working-directory: apps/ssh-cv
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [checks, e2e, go]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: eda936c59e56271336bc33974151f122
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rather than `bun run build`, which used to run here and rebuild
      # everything the `e2e` job had just built and tested.
      - name: Download the built sites
        uses: actions/download-artifact@v4
        with:
          name: worker-dist
          path: apps

      # The artifact is only worth having if the redirect came with it. Asked
      # here, where the answer is one line, rather than discovered three steps
      # later as an esbuild failure about Astro virtual modules - which is a
      # true description of what went wrong and no help at all in finding it.
      - name: Check the built sites arrived intact
        run: |
          for app in web dashboard; do
            for f in .wrangler/deploy/config.json dist/server/wrangler.json; do
              test -f "apps/$app/$f" || {
                echo "::error::apps/$app/$f is missing from the worker-dist artifact"
                exit 1
              }
            done
          done

      # Each app's own `deploy` script, not a `wrangler deploy` written out
      # again here. It was written out again here, and it had already drifted:
      # apps/api's script passes --minify and this job did not, so the one
      # thing the script existed to say was the one thing production never
      # got. The script is the source of truth; this runs it.
      #
      # `wrangler` is a project dependency (installed via bun above), which is
      # why those scripts call it directly rather than going through
      # cloudflare/wrangler-action - that action installs wrangler with a
      # plain `npm i`, and wrangler's own package.json declares
      # `devEngines.packageManager: "bun"`, which npm 10.9+ refuses to
      # satisfy (EBADDEVENGINES), failing every run.
      #
      # apps/api first, and not only out of habit: apps/dashboard now reaches
      # it through a service binding, so on a deploy that changes both, the
      # dashboard should land against an API that already has the new shape.
      - name: Deploy api
        working-directory: apps/api
        run: bun run deploy

      - name: Deploy web
        working-directory: apps/web
        run: bun run deploy

      - name: Deploy dashboard
        working-directory: apps/dashboard
        run: bun run deploy
